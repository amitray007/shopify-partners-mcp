name: Release

# Every push to main that carries a feat: or fix: commit ships a release with no manual step.
# release-please opens a release PR (version bump and changelog), this job merges it at once,
# and a second release-please pass tags vX.Y.Z and creates the GitHub release. The merge happens
# inside this run because a merge made with GITHUB_TOKEN does not start a new workflow run.
# The npm job then checks, builds, packs, and smoke-tests that tag and publishes it through npm
# trusted publishing, so no npm token is stored. npm trusts this file by name; rename it only
# together with the npm setting. The npm job runs only when the repository variable NPM_PUBLISH
# is true. To retry a failed publish, run this workflow by hand with the tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm, such as v0.2.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.prepare.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.prepare.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: prepare
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Merge the release PR
        if: steps.prepare.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Parsed in the script: GitHub evaluates step env even when the step is skipped, and
          # fromJSON fails on the empty output of a run with nothing to release.
          PR_JSON: ${{ steps.prepare.outputs.pr }}
        run: |
          PR_NUMBER="$(jq -r '.number // empty' <<< "${PR_JSON:-null}")"
          if [ -z "${PR_NUMBER}" ]; then
            echo "release-please reported no release PR to merge."
            exit 0
          fi
          # GitHub may still be computing mergeability right after release-please opens the PR.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "${PR_NUMBER}" --squash --repo "${GITHUB_REPOSITORY}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.prepare.outputs.prs_created == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm:
    needs: release-please
    if: >-
      !cancelled() && vars.NPM_PUBLISH == 'true' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Pack and smoke-test the tarball
        # Installing the packed tarball without the lockfile is the point: it is what users get.
        run: | # zizmor: ignore[adhoc-packages]
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::package.json version ${version} does not match tag ${TAG}"
            exit 1
          fi
          mkdir -p out
          pnpm pack --pack-destination out
          install_dir="$(mktemp -d)"
          npm install --prefix "${install_dir}" --no-save --ignore-scripts ./out/*.tgz
          node scripts/smoke.ts "${install_dir}/node_modules/shopify-partners-mcp/dist/index.js"
      - name: Publish
        # The ./ prefix makes npm read a file path, not a GitHub owner/repo shorthand.
        run: npm publish ./out/*.tgz --access public
